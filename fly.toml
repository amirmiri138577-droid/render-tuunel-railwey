# PasarGuard Node on Fly.io
# Change app to a globally unique Fly app name before deploying.
app = "pasarguard-node-change-me"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_HOST = "0.0.0.0"
  SERVICE_PORT = "62050"
  SERVICE_PROTOCOL = "grpc"
  PRINT_CONNECTION_INFO = "true"
  AUTO_GENERATE_CERT = "true"
  REGENERATE_CERT_ON_HOST_CHANGE = "true"
  GENERATED_CONFIG_PATH = "/var/lib/pg-node/generated"

[[mounts]]
  source = "pg_node_data"
  destination = "/var/lib/pg-node"
  initial_size = "1gb"

# Raw TCP passthrough is intentional. Do not add a "tls" handler here:
# PasarGuard Node terminates TLS itself and the panel trusts its certificate.
[[services]]
  internal_port = 62050
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 62050

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "512mb"
